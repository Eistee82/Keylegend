name: Bug report
description: Something behaves differently from what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if the **wrong keys light up**, compare the keyboard in the window with the
        one on your desk — both are filled by the same code, so the window is what the hardware
        should look like. Which cell of the lighting matrix a key belongs to comes from the Chroma
        protocol's own table, confirmed by hand on one keyboard only — a DeathStalker V2 in ISO-DE.
        On any other model it is correct by inference, and your report is what turns that into a
        measurement. Please say which key is wrong and which key lights up instead.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Start Keylegend
        2. Hold AltGr
        3. ...
    validations:
      required: true

  - type: input
    id: keyboard
    attributes:
      label: Keyboard and layout
      placeholder: Razer DeathStalker V2, ISO-DE
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Output of keylegend --dump-layout
      description: |
        The console program ships alongside the application. Run it from the install directory;
        the first two lines say which profile was chosen and whether the keyboard was recognised.
      render: text

  - type: input
    id: version
    attributes:
      label: Keylegend version
      placeholder: 1.0.0
    validations:
      required: true
