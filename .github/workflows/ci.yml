name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    # The application targets Windows (WPF and Windows-only APIs), so it is built there.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        # The tests that read the vendor's drawings report themselves as skipped here: a runner
        # has no Razer Synapse, so there is nothing for them to read. Nineteen of them, and the
        # run says so by name rather than counting them as passes. What still runs is everything
        # that reasons about a drawing rather than reading one.
        run: dotnet test --configuration Release --no-build --verbosity normal --report-trx --report-trx-filename results.trx

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: 'TestResults/*.trx'
          if-no-files-found: ignore

  package:
    name: Package
    runs-on: windows-latest

    # Everything the release does, on every change rather than only at a tag. Packaging has its
    # own class of defect, invisible to a build and to a test: two executables that collide on a
    # case-insensitive filesystem and overwrite each other, or data a project file does not carry
    # into the package. Both have happened here. Finding them at a tag would mean finding them
    # late, so the package is assembled and verified on every change.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the release
        shell: pwsh
        run: ./tools/build-release.ps1 -Version 0.0.0-ci

      - name: Keep the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: package-preview
          path: |
            out/*.exe
            out/*.zip
          retention-days: 7
          if-no-files-found: error

  manifests:
    name: winget manifests
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install a YAML parser
        shell: pwsh
        run: Install-Module powershell-yaml -Force -Scope CurrentUser -AllowClobber

      # No winget on the runner is guaranteed, so this checks what can be checked without it:
      # that the files parse, that they agree with each other, and that the version in them is
      # the version the projects build. A manifest that disagrees with the release it describes
      # fails validation in microsoft/winget-pkgs, which is a slow and public place to find out.
      - name: Check the manifests
        shell: pwsh
        run: |
          Import-Module powershell-yaml

          $folder = 'packaging/winget'
          $files = Get-ChildItem $folder -Filter *.yaml
          if ($files.Count -lt 4) { throw "Expected four manifest files, found $($files.Count)." }

          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          Write-Host "Projects build version $version"

          $problems = @()
          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw

            # Parsing is the point: a tab or a bad indent here is a rejected pull request there.
            try { $null = ConvertFrom-Yaml $text -ErrorAction Stop }
            catch { $problems += "$($file.Name): not valid YAML - $($_.Exception.Message)" }

            if ($text -notmatch '(?m)^PackageIdentifier:\s*Eistee82\.Keylegend\s*$') {
              $problems += "$($file.Name): PackageIdentifier is not Eistee82.Keylegend"
            }
            if ($text -notmatch "(?m)^PackageVersion:\s*$([regex]::Escape($version))\s*`$") {
              $problems += "$($file.Name): PackageVersion does not match Directory.Build.props ($version)"
            }

            # A winget-pkgs moderator asked for DisplayVersion to go: it only repeated
            # PackageVersion, which is what winget assumes when the entry leaves it out
            # (microsoft/winget-pkgs#422422). Cheaper to catch here than in review there.
            if ($text -match '(?m)^\s*DisplayVersion:') {
              $problems += "$($file.Name): DisplayVersion is back - it only repeats PackageVersion"
            }
          }

          if ($problems) { $problems | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "Manifests agree with each other and with the build."
